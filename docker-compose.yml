# KukkuOne — local infrastructure.
# Postgres is the single shared database (one DATABASE_URL).
# Adminer is a lightweight DB UI for local inspection.
# Services (gateway, farmer-api) run on the host via `pnpm dev:backend` for fast
# reloads; see kukkuone-infrastructure/docker-compose.full.yml to containerise them.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kukkuone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kukku
      POSTGRES_PASSWORD: kukku
      POSTGRES_DB: kukkuone
    ports:
      - "5432:5432"
    volumes:
      - kukkuone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kukku -d kukkuone"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: kukkuone-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kukkuone_pgdata:
